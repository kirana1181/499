
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Graphic Design — Kiran Arain</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- W3.CSS -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

  <!-- Google Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">

  <!-- Your CSS -->
  <link rel="stylesheet" href="graphic-design.css">
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="site-name">
      KIRAN ARAIN
    </div>

    <button class="menu-button">
      
    </button>

  </header>


  <!-- =========================
       PAGE
  ========================== -->

  <main class="page">


    <!-- =========================
         INTRO
    ========================== -->
 <div class="page-intro">
    <section class="design-header">

      <div class="design-number">
      posterspostersposters
      </div>

      <h1>
        things i've made (to look at).
      </h1>

      <p class="design-intro">
        Posters, illustrations, ads, etc. Mostly made for films, shows, friends,
        / whatever idea wouldn't leave me alone.
      </p>

    </section>

    <!-- =========================
         FILTER
    ========================== -->

    <section class="filter-section">

      <div class="filter-bar">

        <span class="filter-label">
          VIEW
        </span>

        <button
          class="filter-btn active"
          data-filter="all">
          ALL
        </button>

        <button
          class="filter-btn"
          data-filter="movie">
          FILM
        </button>

        <button
          class="filter-btn"
          data-filter="advertising">
          ADVERTISING
        </button>

        <button
          class="filter-btn"
          data-filter="illustration">
          ILLUSTRATION
        </button>

        <button
          class="filter-btn"
          data-filter="brand">
          BRAND
        </button>

        <button
          class="filter-btn"
          data-filter="shows">
          THEATRE
        </button>

      </div>


      <!-- Changing category text -->

      <div class="current-view">

        <span>
          CURRENTLY LOOKING AT:
        </span>

        <strong id="viewText">
          ALL OF IT, APPARENTLY
        </strong>

      </div>

    </section>


    <!-- =========================
         GALLERY
    ========================== -->

    <section class="photo-grid" id="gallery">


      <!-- FILM -->

      <img
        src="https://picsum.photos/200/300"
        data-category="movie"
        alt="Film poster design"
      >


      <!-- ADVERTISING -->

      <img
     src="https://picsum.photos/200/300"
        data-category="advertising"
        alt="Advertising design"
      >


      <!-- ILLUSTRATION -->

      <img
         src="https://picsum.photos/200/300"
        data-category="illustration"
        alt="Illustration"
      >


      <!-- BRAND -->

      <img
       src="https://picsum.photos/200/300"
        data-category="brand"
        alt="Brand identity design"
      >


      <!-- THEATRE -->

      <img
      src="https://picsum.photos/200/300"
        data-category="shows"
        alt="Theatre design"
      >


      <!-- FILM -->

      <img
        src="https://picsum.photos/200/300"
        data-category="movie"
        alt="Film poster design"
      >


      <!-- ADVERTISING -->

      <img
      src="https://picsum.photos/200/300"
        data-category="advertising"
        alt="Advertising design"
      >


      <!-- ILLUSTRATION -->

      <img
        src="https://picsum.photos/200/300"
        data-category="illustration"
        alt="Illustration"
      >


      <!-- BRAND -->

      <img
        src="https://picsum.photos/200/300"
        data-category="brand"
        alt="Brand identity design"
      >


      <!-- THEATRE -->

      <img
        src="https://picsum.photos/200/300"
        data-category="shows"
        alt="Theatre design"
      >


    </section>


  </main>

 </div>

  <!-- =========================
       IMAGE MODAL
  ========================== -->

  <dialog id="modal01">

    <button
      id="modalClose"
      class="modal-close"
      aria-label="Close image">
      ×
    </button>

    <div class="modal-content">

      <img
        id="img01"
        alt=""
      >

      <p id="caption"></p>

    </div>

  </dialog>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <span>
      KA
    </span>

    <span>
      GRAPHIC DESIGN / 2026
    </span>

  </footer>


  <!-- JavaScript -->
  <script src="graphic-design.js"></script>

</body>
</html>
